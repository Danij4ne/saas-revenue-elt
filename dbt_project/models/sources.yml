version: 2

sources:
  - name: raw
    description: "Raw SaaS source tables loaded into BigQuery."
    database: "{{ target.project }}"
    schema: raw
    # Pipeline freshness (ingestion clock), not business event time.
    # Warn-only: this dataset is a frozen extract, not a daily feed.
    # error_after belongs with a live schedule, not this frozen extract.
    # freshness / loaded_at_field live under config (dbt >= 1.9 / 1.10).
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after:
          count: 7
          period: day
    tables:
      # unique (_run_id, grain): PK may repeat across loads (WRITE_APPEND)
      # but not inside one extract. A same-run duplicate (e.g. two countries
      # for one customer_id) must fail — staging QUALIFY would pick one
      # row at random and snapshots could invent a false SCD2 version.
      #
      # not_null on the grain and on load metadata: unique(_run_id, PK) and
      # freshness(max(_ingested_at)) are silent if those columns are null.
      # _run_date is the first sort key of staging QUALIFY.
      - name: customers
        tests:
          - unique:
              column_name: "(_run_id, customer_id)"
        columns:
          - name: customer_id
            tests:
              - not_null
          - name: _run_date
            tests:
              - not_null
          - name: _run_id
            tests:
              - not_null
          - name: _ingested_at
            tests:
              - not_null
      - name: plans
        tests:
          - unique:
              column_name: "(_run_id, plan_id)"
        columns:
          - name: plan_id
            tests:
              - not_null
          - name: _run_date
            tests:
              - not_null
          - name: _run_id
            tests:
              - not_null
          - name: _ingested_at
            tests:
              - not_null
      - name: subscription_history
        tests:
          - unique:
              column_name: "(_run_id, subscription_version_id)"
        columns:
          - name: subscription_version_id
            tests:
              - not_null
          - name: _run_date
            tests:
              - not_null
          - name: _run_id
            tests:
              - not_null
          - name: _ingested_at
            tests:
              - not_null
      - name: invoices
        tests:
          - unique:
              column_name: "(_run_id, invoice_id)"
        columns:
          - name: invoice_id
            tests:
              - not_null
          - name: _run_date
            tests:
              - not_null
          - name: _run_id
            tests:
              - not_null
          - name: _ingested_at
            tests:
              - not_null
      - name: payments
        tests:
          - unique:
              column_name: "(_run_id, payment_id)"
        columns:
          - name: payment_id
            tests:
              - not_null
          - name: _run_date
            tests:
              - not_null
          - name: _run_id
            tests:
              - not_null
          - name: _ingested_at
            tests:
              - not_null
